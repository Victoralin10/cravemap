<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraveMap — la brújula de antojos de Lima</title>
<meta name="description" content="Describe tu antojo y la Craving Compass te apunta a 3 platos concretos cerca de ti en Lima.">
<style>
  :root{
    --tangerine:#FF6B35;
    --cream:#FFF8EE;
    --iron:#2D2D2A;
    --mustard:#C9A84C;
    --iron-70:rgba(45,45,42,.70);
    --iron-12:rgba(45,45,42,.12);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --r:14px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--cream);
    color:var(--iron);
    font:16px/1.5 var(--sans);
    /* trama de papel de diner, sin imágenes externas */
    background-image:
      radial-gradient(circle at 1px 1px,rgba(45,45,42,.055) 1px,transparent 0),
      linear-gradient(180deg,rgba(255,107,53,.07),transparent 340px);
    background-size:14px 14px,100% 100%;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px 64px}

  /* ---------- cabecera ---------- */
  header{text-align:center;padding:14px 0 6px}
  .badge{
    display:inline-block;font:700 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
    color:var(--iron);background:var(--mustard);border:2px solid var(--iron);
    padding:6px 10px;border-radius:999px;transform:rotate(-1.5deg);
  }
  h1{
    font:700 clamp(2.1rem,10vw,3.1rem)/1.02 var(--serif);
    margin:14px 0 6px;letter-spacing:-.02em;
  }
  h1 em{font-style:normal;color:var(--tangerine);text-shadow:2px 2px 0 rgba(45,45,42,.14)}
  .tagline{margin:0 auto;max-width:34ch;color:var(--iron-70);font-size:1rem}

  /* ---------- brújula ---------- */
  .compass{display:block;width:min(58vw,208px);height:auto;margin:22px auto 6px}
  .compass .ring{fill:var(--cream);stroke:var(--iron);stroke-width:3}
  .compass .ring-inner{fill:none;stroke:var(--iron-12);stroke-width:2}
  .compass .tick{stroke:var(--iron);stroke-width:1.5;opacity:.45}
  .compass .tick.major{stroke-width:3;opacity:1}
  .compass .card-letter{font:700 17px var(--serif);fill:var(--iron-70);text-anchor:middle;dominant-baseline:middle}
  .compass .card-letter.n{fill:var(--tangerine)}
  .compass .needle-n{fill:var(--tangerine)}
  .compass .needle-s{fill:var(--iron)}
  .compass .hub{fill:var(--mustard);stroke:var(--iron);stroke-width:2.5}
  .compass .glow{fill:none;stroke:var(--tangerine);stroke-width:3;opacity:0}
  .compass.is-settled .glow{opacity:.85;transition:opacity .5s ease}

  /* ---------- formulario ---------- */
  form{margin:18px 0 0}
  .field{position:relative}
  label{display:block;font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px 2px}
  textarea{
    width:100%;min-height:96px;resize:vertical;
    font:1.06rem/1.45 var(--sans);color:var(--iron);
    background:#fff;border:2.5px solid var(--iron);border-radius:var(--r);
    padding:14px 15px;box-shadow:4px 4px 0 rgba(45,45,42,.10);
  }
  textarea::placeholder{color:rgba(45,45,42,.45)}
  .count{display:block;text-align:right;font-size:.78rem;color:var(--iron-70);margin-top:6px}
  .count.over{color:#A32D0A;font-weight:700}

  button.go{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;margin-top:12px;cursor:pointer;
    font:700 1.15rem/1 var(--sans);letter-spacing:.01em;color:var(--iron);
    background:var(--tangerine);border:2.5px solid var(--iron);border-radius:var(--r);
    padding:17px 18px;box-shadow:4px 4px 0 var(--iron);
    transition:transform .08s ease,box-shadow .08s ease;
  }
  button.go:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 var(--iron)}
  button.go:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--iron)}
  button.go[disabled]{opacity:.65;cursor:progress;transform:none;box-shadow:4px 4px 0 var(--iron)}

  :where(a,button,textarea,[tabindex]):focus-visible{
    outline:3px solid var(--iron);outline-offset:3px;border-radius:6px;
  }

  /* ---------- chips ---------- */
  .chips{margin:20px 0 0}
  .chips p{margin:0 0 9px;font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--iron-70)}
  .chips ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
  .chip{
    cursor:pointer;font:600 .88rem/1 var(--sans);color:var(--iron);
    background:transparent;border:2px solid var(--iron);border-radius:999px;padding:9px 13px;
    transition:background .12s ease,transform .12s ease;
  }
  .chip:hover{background:var(--mustard);transform:translateY(-1px)}

  /* ---------- resultados ---------- */
  .status{margin:22px 0 0;min-height:1.2em;font-size:.95rem;color:var(--iron-70);text-align:center}
  .status.error{
    color:var(--iron);background:#fff;border:2.5px solid var(--tangerine);border-left-width:8px;
    border-radius:var(--r);padding:14px 16px;text-align:left;box-shadow:4px 4px 0 rgba(45,45,42,.10);
  }
  .status.error strong{display:block;font:700 1rem var(--sans);margin-bottom:3px}

  .results{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:14px}
  .dish{
    position:relative;background:#fff;border:2.5px solid var(--iron);border-radius:var(--r);
    padding:16px 16px 14px 16px;box-shadow:5px 5px 0 rgba(45,45,42,.12);
    animation:pop .34s cubic-bezier(.2,.9,.3,1.35) both;
  }
  .dish:nth-child(2){animation-delay:.08s}
  .dish:nth-child(3){animation-delay:.16s}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .rank{
    position:absolute;top:-13px;left:14px;width:28px;height:28px;border-radius:50%;
    display:grid;place-items:center;font:700 .85rem var(--sans);
    background:var(--tangerine);color:var(--iron);border:2.5px solid var(--iron);
  }
  .dish:nth-child(n+2) .rank{background:var(--mustard)}
  .dish h3{margin:6px 0 0;font:700 1.32rem/1.2 var(--serif);letter-spacing:-.01em}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 0}
  .price{
    font:700 .95rem/1 var(--sans);background:var(--mustard);color:var(--iron);
    border:2px solid var(--iron);border-radius:999px;padding:6px 10px;white-space:nowrap;
  }
  .place{font-size:.95rem;color:var(--iron-70)}
  .place b{color:var(--iron);font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:12px 0 0;padding:0}
  .tags li{font:600 .76rem/1 var(--sans);letter-spacing:.02em;color:var(--iron-70);
    border:1.5px dashed rgba(45,45,42,.35);border-radius:999px;padding:6px 9px}
  .map{
    display:inline-block;margin-top:12px;font:700 .86rem/1 var(--sans);
    color:var(--iron);text-decoration-color:var(--tangerine);text-underline-offset:4px;text-decoration-thickness:2px;
  }
  footer{margin-top:40px;text-align:center;font-size:.8rem;color:var(--iron-70)}

  @media (min-width:560px){
    .wrap{padding-top:34px}
    .compass{margin-top:26px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="badge">Lima · Perú</span>
    <h1>Crave<em>Map</em></h1>
    <p class="tagline">Dinos qué se te antoja. La brújula apunta a <strong>3 platos</strong>, no a 3 restaurantes.</p>
  </header>

  <!-- Craving Compass: decorativa, el estado se anuncia por #status -->
  <svg class="compass" id="compass" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
    <circle class="ring" cx="100" cy="100" r="92"/>
    <circle class="ring-inner" cx="100" cy="100" r="76"/>
    <circle class="glow" cx="100" cy="100" r="97"/>
    <g id="ticks"></g>
    <text class="card-letter n" x="100" y="38">N</text>
    <text class="card-letter" x="162" y="100">E</text>
    <text class="card-letter" x="100" y="162">S</text>
    <text class="card-letter" x="38" y="100">O</text>
    <g id="needle">
      <polygon class="needle-n" points="100,50 109,104 100,96 91,104"/>
      <polygon class="needle-s" points="100,150 91,96 100,104 109,96"/>
    </g>
    <circle class="hub" cx="100" cy="100" r="9"/>
  </svg>

  <form id="form" novalidate>
    <div class="field">
      <label for="craving">Tu antojo, en tus palabras</label>
      <textarea id="craving" name="craving" maxlength="300" autocomplete="off"
        placeholder="algo picante y reconfortante, bajo 25 soles"></textarea>
      <span class="count" id="count">0 / 300</span>
    </div>
    <button class="go" id="go" type="submit">Girar la brújula</button>
  </form>

  <nav class="chips" aria-labelledby="chips-title">
    <p id="chips-title">O prueba con uno de estos</p>
    <ul id="chips">
      <li><button type="button" class="chip">tengo resaca</button></li>
      <li><button type="button" class="chip">algo picante y reconfortante, bajo 25 soles</button></li>
      <li><button type="button" class="chip">algo dulce para la noche</button></li>
      <li><button type="button" class="chip">ligero y fresco para el calor</button></li>
      <li><button type="button" class="chip">barato y que llene</button></li>
    </ul>
  </nav>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <ul class="results" id="results"></ul>

  <footer>Precios referenciales en soles. La brújula apunta al rumbo real del primer plato.</footer>
</div>

<script>
(function () {
  "use strict";

  var API = window.CRAVEMAP_API || "/api/craving";
  var LIMA = { lat: -12.0464, lng: -77.0428 };          // centro para el rumbo
  var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var form    = document.getElementById("form");
  var input   = document.getElementById("craving");
  var count   = document.getElementById("count");
  var go      = document.getElementById("go");
  var status  = document.getElementById("status");
  var results = document.getElementById("results");
  var compass = document.getElementById("compass");
  var needle  = document.getElementById("needle");

  /* ---------- marcas de la rosa ---------- */
  (function ticks() {
    var svg = "";
    for (var i = 0; i < 60; i++) {
      var major = i % 5 === 0;
      var a = (i * 6 - 90) * Math.PI / 180;
      var r1 = major ? 74 : 80, r2 = 88;
      svg += '<line class="tick' + (major ? " major" : "") + '"' +
             ' x1="' + (100 + r1 * Math.cos(a)).toFixed(1) + '" y1="' + (100 + r1 * Math.sin(a)).toFixed(1) +
             '" x2="' + (100 + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (100 + r2 * Math.sin(a)).toFixed(1) + '"/>';
    }
    document.getElementById("ticks").innerHTML = svg;
  })();

  /* ---------- aguja: un solo rAF, resorte amortiguado ----------
     ponytail: física a ojo, no simulación. Si alguien quiere realismo, cambiar k/damp. */
  var angle = -18, vel = 0, target = null, raf = null, spinStart = 0;

  function draw() { needle.setAttribute("transform", "rotate(" + angle.toFixed(2) + " 100 100)"); }

  function frame() {
    if (target === null) {                       // buscando: acelera hasta velocidad de crucero
      vel += (13 - vel) * 0.05;
      angle += vel;
    } else {                                     // encontrado: cae hacia el rumbo y rebota
      var d = ((target - angle) % 360 + 540) % 360 - 180;
      vel = (vel + d * 0.014) * 0.87;
      angle += vel;
      if (Math.abs(d) < 0.08 && Math.abs(vel) < 0.08) {
        angle = target; vel = 0; raf = null; draw();
        compass.classList.add("is-settled");
        return;
      }
    }
    draw();
    raf = requestAnimationFrame(frame);
  }

  function spin() {
    compass.classList.remove("is-settled");
    target = null; spinStart = Date.now();
    if (REDUCED) return;
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function settle(deg) {
    var wait = Math.max(0, 750 - (Date.now() - spinStart));   // que se note que buscó
    setTimeout(function () {
      target = ((deg % 360) + 360) % 360 + Math.round(angle / 360) * 360;
      if (REDUCED) { angle = target; vel = 0; draw(); compass.classList.add("is-settled"); return; }
      if (!raf) raf = requestAnimationFrame(frame);
    }, wait);
  }

  function stop() {                                            // error: la aguja se rinde donde esté
    setTimeout(function () { settle(angle % 360); }, 0);
  }

  function bearing(d) {
    if (typeof d.lat !== "number" || typeof d.lng !== "number") return -18;
    var r = Math.PI / 180;
    var f1 = LIMA.lat * r, f2 = d.lat * r, dl = (d.lng - LIMA.lng) * r;
    var y = Math.sin(dl) * Math.cos(f2);
    var x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
    return Math.atan2(y, x) / r;
  }

  draw();

  /* ---------- pintado ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function soles(p) {
    var n = Number(p);
    return isFinite(n) ? "S/ " + (n % 1 ? n.toFixed(2) : n) : "S/ —";
  }

  function card(d, i) {
    var tags = (d.tags || []).slice(0, 6).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    var where = [d.lugar, d.distrito].filter(Boolean).map(esc);
    var map = (typeof d.lat === "number" && typeof d.lng === "number")
      ? '<a class="map" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=' +
        d.lat + "," + d.lng + '">Ver en el mapa<span aria-hidden="true"> ↗</span></a>' : "";
    return '<li class="dish">' +
      '<span class="rank" aria-hidden="true">' + (i + 1) + "</span>" +
      "<h3>" + esc(d.nombre || "Plato sin nombre") + "</h3>" +
      '<div class="meta"><span class="price">' + esc(soles(d.precio)) + "</span>" +
      (where.length ? '<span class="place"><b>' + where[0] + "</b>" +
        (where[1] ? " · " + where[1] : "") + "</span>" : "") + "</div>" +
      (tags ? '<ul class="tags">' + tags + "</ul>" : "") + map + "</li>";
  }

  function say(msg, isError) {
    status.textContent = "";
    status.className = "status" + (isError ? " error" : "");
    if (!msg) return;
    if (isError) {
      status.innerHTML = "<strong>" + esc(msg.title) + "</strong>" + esc(msg.detail);
    } else {
      status.textContent = msg;
    }
  }

  function render(craving, dishes) {
    results.innerHTML = dishes.map(card).join("");
    say(dishes.length + " platos para “" + craving + "”. El primero: " +
        dishes[0].nombre + ", " + soles(dishes[0].precio) +
        (dishes[0].distrito ? ", en " + dishes[0].distrito : "") + ".");
    settle(bearing(dishes[0]));
  }

  /* ---------- datos demo ---------- */
  var DEMO = [
    { id: "parihuela-04", nombre: "Parihuela", precio: 35, distrito: "Callao", lugar: "Chalaquita",
      lat: -12.0566, lng: -77.1181, tags: ["caldoso", "picante", "reconfortante", "marino", "resaca"] },
    { id: "aji-gallina-07", nombre: "Ají de gallina", precio: 20, distrito: "Jesús María", lugar: "Menú de barrio",
      lat: -12.0748, lng: -77.0489, tags: ["cremoso", "suave", "reconfortante", "clásico", "económico"] },
    { id: "anticucho-08", nombre: "Anticuchos de corazón", precio: 18, distrito: "Barranco", lugar: "Carretilla de Grau",
      lat: -12.1464, lng: -77.0206, tags: ["parrilla", "picante", "callejero", "noche"] }
  ];

  /* ---------- envío ---------- */
  var busy = false;

  input.addEventListener("input", function () {
    count.textContent = input.value.length + " / 300";
    count.classList.toggle("over", input.value.length >= 300);
  });

  document.getElementById("chips").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    input.value = chip.textContent;
    input.dispatchEvent(new Event("input"));
    form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true }));
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;

    var craving = input.value.trim();
    if (!craving) {
      say({ title: "Nos falta el antojo", detail: "Escribe qué se te antoja, aunque sea vago: “algo caliente”, “tengo resaca”." }, true);
      input.focus();
      return;
    }

    busy = true;
    go.disabled = true;
    go.textContent = "Buscando…";
    results.innerHTML = "";
    say("Girando la brújula…");
    spin();

    var req = window.CRAVEMAP_DEMO
      ? new Promise(function (ok) { setTimeout(function () { ok({ craving: craving, dishes: DEMO }); }, 900); })
      : fetch(API, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ craving: craving })
        }).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        });

    req.then(function (data) {
      var dishes = (data && Array.isArray(data.dishes)) ? data.dishes.filter(Boolean) : [];
      if (!dishes.length) {
        stop();
        say({ title: "La brújula giró en vano",
              detail: "No encontramos platos para ese antojo. Prueba con algo más simple: un sabor, un precio, un momento del día." }, true);
        return;
      }
      render(data.craving || craving, dishes.slice(0, 3));
    }).catch(function (err) {
      stop();
      say({ title: "La brújula perdió el norte",
            detail: "No pudimos consultar el servicio (" + (err && err.message ? err.message : "error de red") +
                    "). Revisa tu conexión y vuelve a intentar." }, true);
    }).then(function () {
      busy = false;
      go.disabled = false;
      go.textContent = "Girar la brújula";
    });
  });
})();
</script>
</body>
</html>
